name: Library TDD - David Valdez Homework 6

on:
  pull_request:
    paths:
      - "students/davidvaldezm/homework-6/**"
      - ".github/workflows/davidvaldezm-homework-6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: students/davidvaldezm/homework-6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check --workers 1 src tests
      - run: python -m isort --check-only --profile=black src tests
      - run: python -m pylint src tests
      - run: python -m pytest -q --cov=src --cov-branch --cov-fail-under=90 --cov-report=term-missing --cov-report=html:coverage --cov-report=json:coverage.json --junitxml=python-results.xml
      - name: Check statement and branch thresholds
        run: |
          python - <<'PY'
          import json
          totals = json.load(open("coverage.json", encoding="utf-8"))["totals"]
          assert totals["covered_lines"] / totals["num_statements"] > 0.90
          assert totals["covered_branches"] / totals["num_branches"] > 0.85
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-tdd-python-${{ matrix.python }}
          path: |
            students/davidvaldezm/homework-6/coverage
            students/davidvaldezm/homework-6/coverage.json
            students/davidvaldezm/homework-6/python-results.xml
