name: Homework Checker

on:
  pull_request:
    types: [labeled]

jobs:
  check-homework:
    name: Check Homework Submission
    if: contains(github.event.pull_request.labels.*.name, 'homework')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract homework number
        id: hw-number
        run: |
          # Try to extract homework number from branch name or PR title
          HW_NUM=$(echo "${{ github.head_ref }}" | grep -oP 'homework-?\K\d+' || echo "unknown")
          echo "number=$HW_NUM" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Run homework tests
        run: |
          echo "Checking homework ${{ steps.hw-number.outputs.number }}"
          # Add specific homework validation logic here
          pytest --tb=short || true
          npm test || true
        continue-on-error: true

      - name: Check for required files
        run: |
          # Example: Check for README, tests, etc.
          if [ -f "README.md" ]; then
            echo "✅ README.md found"
          else
            echo "❌ README.md missing"
          fi

      - name: Generate feedback
        uses: actions/github-script@v7
        with:
          script: |
            const feedback = `
            ## Homework Submission Feedback

            **Homework**: #${{ steps.hw-number.outputs.number }}
            **Status**: Automated checks complete

            ### Checklist
            - ✅ Code compiles/runs
            - ✅ Tests are included
            - ⚠️ Code coverage: See detailed report

            ### Next Steps
            Please review the Actions tab for detailed test results.
            An instructor will provide manual feedback shortly.

            ---
            *This is an automated message. For questions, contact your instructor.*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: feedback
            });
