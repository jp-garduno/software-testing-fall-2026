name: Student Submission Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'students/**'

jobs:
  validate-submission:
    name: Validate Student Work
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          students/**/*.py
          students/**/*.js
          students/**/*.ts

    - name: Run tests on changed Python files
      if: contains(steps.changed-files.outputs.all_changed_files, '.py')
      run: |
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == *.py ]]; then
            echo "Testing $file"
            pytest "$file" -v || true
          fi
        done
      continue-on-error: true

    - name: Run tests on changed JavaScript files
      if: contains(steps.changed-files.outputs.all_changed_files, '.js') || contains(steps.changed-files.outputs.all_changed_files, '.ts')
      run: |
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == *.test.js ]] || [[ $file == *.spec.js ]]; then
            echo "Testing $file"
            npm test -- "$file" || true
          fi
        done
      continue-on-error: true

    - name: Check code style
      run: |
        echo "Checking Python code style..."
        pylint ${{ steps.changed-files.outputs.all_changed_files }} --exit-zero || true

        echo "Checking JavaScript code style..."
        npm run lint || true
      continue-on-error: true

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Submission validated! Your tests have been run. Check the Actions tab for detailed results.'
          })
