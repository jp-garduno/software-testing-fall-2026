name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Python Testing and Linting
  python-tests:
    name: Python Tests & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Pylint
        run: |
          pylint **/*.py --exit-zero || true
        continue-on-error: true

      - name: Format check with Black
        run: |
          black --check . || true
        continue-on-error: true

      - name: Run Python tests
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term
        continue-on-error: true

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
        continue-on-error: true

  # JavaScript Testing and Linting
  javascript-tests:
    name: JavaScript Tests & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run JavaScript tests
        run: npm test -- --coverage
        continue-on-error: true

      - name: Upload JavaScript coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: javascript
          name: javascript-${{ matrix.node-version }}
        continue-on-error: true

  # Pre-commit hooks validation
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files
        continue-on-error: true

  # Playwright E2E Tests
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run playwright
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # Check for common issues
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path "./.git/*" -not -path "*/node_modules/*" || true

      - name: Check for TODO/FIXME comments
        run: |
          grep -r "TODO\|FIXME" --exclude-dir={.git,node_modules,venv} . || echo "No TODOs found"
        continue-on-error: true

      - name: Check for broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
        continue-on-error: true

  # All checks summary
  all-checks:
    name: All Checks Summary
    runs-on: ubuntu-latest
    needs:
      [
        python-tests,
        javascript-tests,
        pre-commit,
        playwright-tests,
        security,
        quality-checks,
      ]
    if: always()

    steps:
      - name: Check status
        run: |
          echo "Python tests: ${{ needs.python-tests.result }}"
          echo "JavaScript tests: ${{ needs.javascript-tests.result }}"
          echo "Pre-commit: ${{ needs.pre-commit.result }}"
          echo "Playwright: ${{ needs.playwright-tests.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Quality: ${{ needs.quality-checks.result }}"
