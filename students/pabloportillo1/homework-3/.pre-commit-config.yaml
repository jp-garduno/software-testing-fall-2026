# Pre-commit configuration for Homework 3.
# Scoped with `files:` so the hooks only touch this submission and never
# reformat the rest of the course repository.
default_language_version:
  python: python3.11

files: ^students/pabloportillo1/homework-3/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        args: ["--line-length=120"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  - repo: https://github.com/pycqa/pylint
    rev: v3.1.0
    hooks:
      - id: pylint
        args:
          - "--rcfile=students/pabloportillo1/homework-3/.pylintrc"
        exclude: ^students/pabloportillo1/homework-3/test_

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-q"]
        exclude: ^students/pabloportillo1/homework-3/test_

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # the commit-msg file is outside the top-level `files` scope, so widen it here
        files: .*
