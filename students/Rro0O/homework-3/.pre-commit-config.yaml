repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^students/Rro0O/homework-3/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^students/Rro0O/homework-3/

  - repo: https://github.com/pycqa/pylint
    rev: v3.2.5
    hooks:
      - id: pylint
        files: ^students/Rro0O/homework-3/src/
        args: ["--rcfile=students/Rro0O/homework-3/.pylintrc"]
