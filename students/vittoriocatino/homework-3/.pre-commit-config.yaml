default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^students/vittoriocatino/homework-3/
      - id: end-of-file-fixer
        files: ^students/vittoriocatino/homework-3/
      - id: check-yaml
        files: ^students/vittoriocatino/homework-3/.*\.ya?ml$
      - id: check-json
        files: ^students/vittoriocatino/homework-3/.*\.json$
      - id: check-added-large-files
        args: [--maxkb=500]
        files: ^students/vittoriocatino/homework-3/

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^students/vittoriocatino/homework-3/(src/.*\.py|test_.*\.py)$

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black]
        files: ^students/vittoriocatino/homework-3/(src/.*\.py|test_.*\.py)$

  - repo: https://github.com/PyCQA/pylint
    rev: v3.3.6
    hooks:
      - id: pylint
        args: [--rcfile=students/vittoriocatino/homework-3/.pylintrc]
        files: ^students/vittoriocatino/homework-3/(src/.*\.py|test_.*\.py)$
        additional_dependencies: ["pytest>=8.0,<10"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-q]
        files: ^students/vittoriocatino/homework-3/src/.*\.py$
