minimum_pre_commit_version: '4.3.0'
files: ^students/A4ld0/homework-3/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: ['--config=students/A4ld0/homework-3/pyproject.toml']
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ['--settings-path=students/A4ld0/homework-3/pyproject.toml']
  - repo: https://github.com/PyCQA/pylint
    rev: v3.3.8
    hooks:
      - id: pylint
        args: ['--rcfile=students/A4ld0/homework-3/.pylintrc']
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['--quiet']
