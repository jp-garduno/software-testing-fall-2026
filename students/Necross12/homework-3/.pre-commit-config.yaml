repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  #  - repo: https://github.com/pre-commit/mirrors-eslint
  #    rev: v9.15.0
  #    hooks:
  #      - id: eslint
  #        files: ^students/Necross12/homework-3/.*\.(js|jsx|ts|tsx)$
  #        additional_dependencies:
  #          - eslint@9.15.0
  #          - '@eslint/js@9.15.0'
  #          - globals@15.9.0

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --config students/Necross12/homework-3/eslint.config.mjs
        language: system
        files: ^students/Necross12/homework-3/.*\.(js|jsx|ts|tsx)$
