<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator" id="calculator">
      <section class="display" aria-live="polite">
        <div class="display-history" id="history">&nbsp;</div>
        <div class="display-current" id="current">0</div>
      </section>

      <section class="keys" id="keys">
        <button class="key key-action" data-action="clear">C</button>
        <button class="key key-action" data-action="sign">+/-</button>
        <button class="key key-action" data-action="percent">%</button>
        <button class="key key-operator" data-operator="/">÷</button>

        <button class="key key-digit" data-digit="7">7</button>
        <button class="key key-digit" data-digit="8">8</button>
        <button class="key key-digit" data-digit="9">9</button>
        <button class="key key-operator" data-operator="*">×</button>

        <button class="key key-digit" data-digit="4">4</button>
        <button class="key key-digit" data-digit="5">5</button>
        <button class="key key-digit" data-digit="6">6</button>
        <button class="key key-operator" data-operator="-">−</button>

        <button class="key key-digit" data-digit="1">1</button>
        <button class="key key-digit" data-digit="2">2</button>
        <button class="key key-digit" data-digit="3">3</button>
        <button class="key key-operator" data-operator="+">+</button>

        <button class="key key-digit key-zero" data-digit="0">0</button>
        <button class="key key-digit" data-action="decimal">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </section>
    </main>

    <script src="src/operations.js"></script>
    <script src="src/calculator.js"></script>
    <script src="src/ui.js"></script>
  </body>
</html>
