repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: ^students/ingegonzalo/homework-3/
      - id: end-of-file-fixer
        files: ^students/ingegonzalo/homework-3/
      - id: check-yaml
        files: ^students/ingegonzalo/homework-3/
      - id: check-json
        files: ^students/ingegonzalo/homework-3/
      - id: check-added-large-files
        files: ^students/ingegonzalo/homework-3/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^students/ingegonzalo/homework-3/
        types_or: [javascript, css, html]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: ^students/ingegonzalo/homework-3/src/.*\.js$
