# Static analysis in CI (bonus).
#
# In a standalone repository this file lives at
# .github/workflows/static-analysis.yml. It is kept under ci/ here because
# this project sits in a subdirectory of the course repository, where GitHub
# only reads workflows from the repository root; putting it there would run
# against the whole course repo, not this project.
#
# It runs the same three tools as the pre-commit hooks, over every file rather
# than only the staged ones, because pre-commit can be skipped with
# --no-verify and CI cannot.

name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-analysis:
    name: Lint, format check and security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install the tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting with black
        run: black --check --diff --line-length=120 src/

      - name: Check import order with isort
        run: isort --check-only --diff --profile=black --line-length=120 src/

      - name: Lint with pylint
        # --fail-under keeps the build honest: a score that drops below 10
        # fails instead of being quietly reported.
        run: pylint --rcfile=.pylintrc --fail-under=10 src/

      - name: Security scan with bandit
        run: bandit -c bandit.yaml -r src/

      - name: Run every pre-commit hook
        uses: pre-commit/action@v3.0.1
